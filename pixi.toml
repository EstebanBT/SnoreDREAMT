[workspace]
name = "snoredreamt"
description = "Respiration–SO/spindle coupling during apnea, hypopnea and snoring (DREAMT)"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.10.*"
numpy = ">=2.2,<2.3"
scipy = ">=1.15,<1.16"
pandas = ">=2.3,<2.4"
pyarrow = ">=20"
matplotlib = ">=3.10,<3.11"
pyyaml = ">=6"
statsmodels = ">=0.14"
pytest = "*"
r-base = "4.5.*"
r-lme4 = "*"
graphviz = "*"
quarto = "*"

[pypi-dependencies]
snakemake = "==7.32.4"
pulp = "<2.8"
snoredreamt = { path = ".", editable = true }

[tasks]
test = "pytest -q"
pipeline = "snakemake -j 8"
dag = "snakemake --rulegraph | dot -Tpng -Gdpi=150 -o figures/pipeline_dag.png"
report = "quarto render reports/SnoreDREAMT_report.qmd"
