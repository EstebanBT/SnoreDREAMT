[project]
name = "snoredreamt"
version = "0.1.0"
description = "Respiration–SO/spindle coupling during apnea, hypopnea and snoring (DREAMT)"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "pyarrow", "matplotlib", "pyyaml", "statsmodels", "snakemake<8", "pulp<2.8"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["snoredreamt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
